[package]
name = "statsoverlay"
version = "0.3.0"
edition = "2021"
description = "Tiny Windows 11 taskbar resource monitor (Windows vs WSL2)"
build = "build.rs"

[features]
default = ["batteries"]
# Device batteries (Logitech HID++, Bluetooth). Off at runtime until enabled.
batteries = [
    "windows/Win32_Devices_DeviceAndDriverInstallation",
    "windows/Win32_Devices_HumanInterfaceDevice",
    "windows/Win32_Devices_Properties",
    "windows/Win32_System_IO",
]

[dependencies]
windows-numerics = "0.3"

[dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Power",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
    "Wdk_Graphics_Direct3D",
    "Wdk_System_SystemInformation",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
